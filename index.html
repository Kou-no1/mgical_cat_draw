<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAGICAL CAT DRAW</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg-1:#fde7f3;--bg-2:#e8d5ff;--bg-3:#c8e6ff;
  --pink:#ff8ec5;--pink-deep:#e84a9c;
  --lavender:#b794e8;--mint:#8eddc7;
  --gold:#ffcc4a;--gold-deep:#f0a020;
  --ink:#4a3960;--ink-soft:#8472a0;
  --shadow:rgba(180,120,200,.25);
  --panel-w:200px;
  --history-w:140px;
}

html,body{
  height:100%;min-height:100%;
  background:linear-gradient(135deg,var(--bg-1) 0%,var(--bg-2) 50%,var(--bg-3) 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:'Zen Maru Gothic',sans-serif;
  overflow-y:auto;
  overflow-x:hidden;
}

/* ── BG decoration ── */
#bg-stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-star{
  position:absolute;width:6px;height:6px;background:var(--gold);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  opacity:.5;animation:twinkle var(--dur,3s) ease-in-out infinite;animation-delay:var(--delay,0s);
}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8) rotate(0deg);}50%{opacity:.9;transform:scale(1.3) rotate(180deg);}}
.bg-blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.4;animation:float-blob 12s ease-in-out infinite;}
@keyframes float-blob{0%,100%{transform:translate(0,0);}33%{transform:translate(40px,-30px);}66%{transform:translate(-30px,40px);}}

/* ── MAIN LAYOUT ── */
#layout{
  position:relative;z-index:10;
  min-height:100vh;
  display:flex;
  align-items:flex-start;
}

/* ── LEFT PANEL (floating window) ── */
#num-panel{
  position:fixed;
  top:80px;left:12px;
  width:var(--panel-w);
  z-index:50;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(16px);
  border:2px solid rgba(183,148,232,.45);
  border-radius:16px;
  box-shadow:0 8px 32px var(--shadow), 0 2px 8px rgba(232,74,156,.12);
  overflow:hidden;
  transition:transform .3s cubic-bezier(.17,.67,.3,1.3), opacity .25s;
}
#num-panel.hidden{
  transform:translateX(calc(-100% - 20px));
  opacity:0;
  pointer-events:none;
}
#panel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px 8px;
  background:linear-gradient(135deg,rgba(255,180,220,.4),rgba(200,170,240,.4));
  border-bottom:1.5px solid rgba(183,148,232,.3);
  cursor:default;
  user-select:none;
}
#panel-title{
  font-family:'Mochiy Pop One',sans-serif;font-size:12px;
  letter-spacing:.08em;color:var(--ink);
}
#panel-close{
  width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(232,74,156,.2);color:var(--pink-deep);
  font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:all .15s;font-weight:700;
}
#panel-close:hover{background:var(--pink-deep);color:white;}

#num-grid{
  display:flex;flex-direction:column;gap:4px;
  padding:10px;
  max-height:calc(100vh - 160px);
  overflow-y:auto;
}
#num-grid::-webkit-scrollbar{width:4px;}
#num-grid::-webkit-scrollbar-thumb{background:var(--lavender);border-radius:2px;}

.num-btn{
  width:100%;height:34px;border-radius:8px;
  border:2px solid rgba(183,148,232,.35);
  background:rgba(255,255,255,.7);
  color:var(--ink-soft);
  font-family:'Mochiy Pop One',sans-serif;font-size:14px;
  cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;
}
.num-btn:hover{background:rgba(255,180,220,.35);border-color:var(--pink);color:var(--pink-deep);}
.num-btn.selected{
  background:linear-gradient(135deg,var(--pink),var(--lavender));
  border-color:var(--lavender);color:white;
  box-shadow:0 3px 10px rgba(232,74,156,.35);
}
.num-btn.drawn{
  background:rgba(180,148,232,.12);border-color:rgba(180,148,232,.2);
  color:rgba(74,57,96,.3);cursor:default;
}
.num-btn.drawn.selected{
  background:rgba(232,74,156,.12);border-color:rgba(232,74,156,.25);
}

/* panel toggle btn */
#panel-toggle{
  position:fixed;top:80px;left:12px;
  z-index:51;
  width:36px;height:36px;border-radius:10px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--pink),var(--lavender));
  color:white;font-size:18px;
  box-shadow:0 4px 14px rgba(232,74,156,.4);
  display:none;align-items:center;justify-content:center;
  transition:all .2s;
}
#panel-toggle:hover{transform:scale(1.1);}
#num-panel.hidden ~ #panel-toggle,
#panel-toggle.visible{display:flex;}

/* ── MAIN CONTENT ── */
#app{
  flex:1;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;
  padding:0 20px 40px;
  margin-left:calc(var(--panel-w) + 28px);
  margin-right:calc(var(--history-w) + 16px);
  transition:margin-left .3s, margin-right .3s;
}
#app.panel-hidden{
  margin-left:60px;
}

/* ── HEADER ── */
#header{padding:18px 0 8px;text-align:center;flex-shrink:0;}
#title{
  font-family:'Mochiy Pop One',sans-serif;
  font-size:clamp(26px,4.5vw,44px);letter-spacing:.05em;
  background:linear-gradient(135deg,var(--pink-deep) 0%,var(--lavender) 50%,var(--gold-deep) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 12px rgba(232,74,156,.3));line-height:1;
}
#subtitle{font-size:11px;letter-spacing:.4em;color:var(--ink-soft);margin-top:6px;}

/* ── MODE TABS ── */
#mode-tabs{
  display:flex;gap:6px;margin-top:12px;
  background:rgba(255,255,255,.5);backdrop-filter:blur(10px);
  padding:4px;border-radius:14px;
  border:2px solid rgba(255,255,255,.8);
  box-shadow:0 4px 16px var(--shadow);
}
.mode-tab{
  font-family:'Zen Maru Gothic',sans-serif;font-weight:700;
  font-size:12px;letter-spacing:.08em;
  padding:7px 18px;border-radius:10px;border:none;cursor:pointer;
  background:transparent;color:var(--ink-soft);transition:all .2s;
}
.mode-tab.active{
  background:linear-gradient(135deg,var(--pink),var(--lavender));
  color:white;box-shadow:0 3px 10px rgba(232,74,156,.35);
}

/* ── CONFIG ── */
#config{flex-shrink:0;width:100%;max-width:560px;margin-top:12px;}
.config-row{
  display:flex;align-items:center;gap:10px;
  flex-wrap:wrap;justify-content:center;margin-bottom:8px;
}
.config-label{font-size:11px;letter-spacing:.2em;color:var(--ink-soft);font-weight:700;}
.num-input{
  font-family:'Mochiy Pop One',sans-serif;font-size:17px;
  width:78px;padding:6px 10px;border-radius:10px;
  border:2.5px solid var(--lavender);
  background:rgba(255,255,255,.85);color:var(--ink);
  text-align:center;outline:none;transition:all .2s;
}
.num-input:focus{border-color:var(--pink-deep);box-shadow:0 0 0 4px rgba(232,74,156,.15);}
.draw-count-input{width:58px;}
.text-area{
  width:100%;max-width:540px;min-height:70px;
  font-family:'Zen Maru Gothic',sans-serif;font-size:14px;
  padding:10px 14px;border-radius:12px;
  border:2.5px solid var(--lavender);
  background:rgba(255,255,255,.85);color:var(--ink);
  outline:none;resize:vertical;transition:all .2s;
}
.text-area:focus{border-color:var(--pink-deep);box-shadow:0 0 0 4px rgba(232,74,156,.15);}
.text-area::placeholder{color:var(--ink-soft);opacity:.7;}

.sound-toggle{
  display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-soft);
  cursor:pointer;user-select:none;
}
.sound-toggle input{display:none;}
.toggle-track{
  width:36px;height:20px;border-radius:10px;
  background:rgba(180,148,232,.3);position:relative;transition:all .2s;
}
.toggle-track::after{
  content:'';position:absolute;top:2px;left:2px;
  width:16px;height:16px;border-radius:50%;background:white;
  box-shadow:0 2px 4px rgba(0,0,0,.2);transition:all .2s;
}
.sound-toggle input:checked + .toggle-track{background:linear-gradient(135deg,var(--pink),var(--lavender));}
.sound-toggle input:checked + .toggle-track::after{left:18px;}

/* ── CAT + CRYSTAL ── */
#scene{
  flex-shrink:0;margin-top:10px;position:relative;
  width:clamp(260px,50vw,340px);height:clamp(210px,38vw,270px);
}
#cat-wrap{position:absolute;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;}
#cat-svg{width:100%;height:100%;transition:transform .3s;}
.cat-ear{transform-origin:center bottom;transition:transform .2s;}
.cat-tail{transform-origin:right center;animation:tail-idle 3s ease-in-out infinite;}
@keyframes tail-idle{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(8deg);}}
.cat-tail.excited{animation:tail-wag .25s ease-in-out infinite;}
@keyframes tail-wag{0%,100%{transform:rotate(-20deg);}50%{transform:rotate(25deg);}}
#cat-svg.celebrate{animation:cat-bounce .4s ease-in-out;}
@keyframes cat-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}

#crystal-wrap{
  position:absolute;left:50%;top:16%;
  transform:translateX(-50%);
  width:clamp(130px,24vw,170px);height:clamp(130px,24vw,170px);
  pointer-events:none;
}
#crystal-ring{
  position:absolute;inset:-10px;border-radius:50%;
  border:3px solid rgba(232,74,156,.3);
  box-shadow:0 0 30px rgba(232,74,156,.2);transition:all .3s;
}
#crystal-ring.active{
  border-color:rgba(232,74,156,.8);
  box-shadow:0 0 50px rgba(232,74,156,.5),0 0 100px rgba(180,148,232,.3);
  animation:ring-spin 1s linear infinite;
}
@keyframes ring-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
#crystal{
  width:100%;height:100%;border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,rgba(255,255,255,.9) 0%,rgba(255,255,255,.3) 20%,transparent 40%),
    radial-gradient(circle at 50% 50%,rgba(255,180,220,.85) 0%,rgba(200,170,240,.75) 35%,rgba(170,220,240,.7) 70%,rgba(255,200,150,.6) 100%);
  border:3px solid rgba(255,255,255,.7);
  box-shadow:inset 0 -8px 30px rgba(180,120,200,.4),inset 0 8px 20px rgba(255,255,255,.6),0 8px 30px rgba(180,120,200,.4);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
#crystal.rolling{animation:crystal-pulse .4s ease-in-out infinite alternate;}
@keyframes crystal-pulse{
  from{box-shadow:inset 0 -8px 30px rgba(180,120,200,.4),inset 0 8px 20px rgba(255,255,255,.6),0 8px 30px rgba(232,74,156,.5);}
  to{box-shadow:inset 0 -8px 30px rgba(180,120,200,.4),inset 0 8px 20px rgba(255,255,255,.8),0 8px 50px rgba(232,74,156,.8),0 0 80px rgba(180,148,232,.5);}
}
#crystal-text{
  font-family:'Mochiy Pop One',sans-serif;
  font-size:clamp(38px,7vw,58px);line-height:1;
  color:white;text-shadow:0 3px 8px rgba(180,120,200,.6),0 0 20px rgba(255,255,255,.5);
  position:relative;z-index:2;word-break:break-all;text-align:center;padding:0 6px;max-width:90%;
}
#crystal-text.ready{font-size:16px;letter-spacing:.15em;opacity:.85;font-family:'Zen Maru Gothic',sans-serif;font-weight:500;}
#crystal-text.rolling-text{animation:roll-shake .08s linear infinite;}
@keyframes roll-shake{0%{transform:translateY(0) scale(1);}25%{transform:translateY(-3px) scale(1.05);}50%{transform:translateY(2px) scale(.97);}75%{transform:translateY(-1px) scale(1.02);}100%{transform:translateY(0) scale(1);}}
#crystal-text.result{animation:result-pop .5s cubic-bezier(.17,.67,.3,1.4);}
@keyframes result-pop{0%{transform:scale(0.2) rotate(-15deg);opacity:0;}60%{transform:scale(1.2) rotate(5deg);}80%{transform:scale(.95) rotate(-2deg);}100%{transform:scale(1) rotate(0);}}

.shard{
  position:absolute;width:20px;height:20px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,180,220,.6));
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
  animation:shard-fly .6s ease-out forwards;
}
@keyframes shard-fly{0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1;}100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(0);opacity:0;}}

.particle{position:absolute;pointer-events:none;animation:particle-fly var(--dur,1s) ease-out forwards;}
.particle.heart{width:14px;height:14px;background:var(--pink);clip-path:path('M 7,3 C 4,0 0,1 0,5 C 0,8 7,14 7,14 C 7,14 14,8 14,5 C 14,1 10,0 7,3 Z');}
.particle.star{width:14px;height:14px;background:var(--gold);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
.particle.sparkle{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,white,rgba(255,255,255,0));}
@keyframes particle-fly{0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1;}100%{transform:translate(var(--tx),var(--ty)) scale(0) rotate(var(--rot,360deg));opacity:0;}}

/* ── CONTROLS ── */
#controls{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap;justify-content:center;flex-shrink:0;}
#btn-draw{
  font-family:'Mochiy Pop One',sans-serif;font-size:18px;letter-spacing:.08em;
  padding:13px 36px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--pink) 0%,var(--lavender) 50%,var(--gold) 100%);
  background-size:200% 200%;color:white;
  text-shadow:0 2px 4px rgba(232,74,156,.4);
  box-shadow:0 6px 20px rgba(232,74,156,.4),inset 0 -3px 0 rgba(0,0,0,.1),inset 0 2px 0 rgba(255,255,255,.4);
  transition:all .2s;animation:btn-shimmer 3s ease-in-out infinite;
}
@keyframes btn-shimmer{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
#btn-draw:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 30px rgba(232,74,156,.5),inset 0 -3px 0 rgba(0,0,0,.1),inset 0 2px 0 rgba(255,255,255,.4);}
#btn-draw:active{transform:scale(.96);}
#btn-draw:disabled{opacity:.4;cursor:not-allowed;animation:none;transform:none;}
#btn-reset{
  font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;
  padding:11px 20px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.7);border:2px solid var(--lavender);color:var(--ink-soft);
  transition:all .2s;display:flex;align-items:center;gap:6px;
}
#btn-reset:hover{background:white;color:var(--pink-deep);border-color:var(--pink);}
#btn-reset svg{width:14px;height:14px;flex-shrink:0;}

/* ── COUNTER ── */
#counter{font-size:12px;letter-spacing:.2em;color:var(--ink-soft);font-weight:700;margin-top:10px;flex-shrink:0;}
#counter strong{color:var(--pink-deep);font-size:14px;}

/* ── RIGHT HISTORY PANEL ── */
#history-panel{
  position:fixed;
  top:0;right:0;
  width:var(--history-w);
  height:100vh;
  z-index:40;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(16px);
  border-left:2px solid rgba(183,148,232,.35);
  box-shadow:-4px 0 24px var(--shadow);
  display:flex;flex-direction:column;
  overflow:hidden;
}
#history-panel-header{
  flex-shrink:0;
  padding:14px 10px 10px;
  background:linear-gradient(135deg,rgba(255,180,220,.35),rgba(200,170,240,.35));
  border-bottom:1.5px solid rgba(183,148,232,.3);
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
#history-panel-title{
  font-family:'Mochiy Pop One',sans-serif;font-size:11px;
  letter-spacing:.1em;color:var(--ink);
}
#history-count{
  background:linear-gradient(135deg,var(--pink),var(--lavender));
  color:white;font-size:11px;padding:2px 10px;border-radius:10px;
  font-family:'Mochiy Pop One',sans-serif;box-shadow:0 2px 6px rgba(232,74,156,.3);
  min-width:28px;text-align:center;
}
#history-list{
  flex:1;overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;
  gap:5px;padding:10px 8px 16px;
}
#history-list::-webkit-scrollbar{width:3px;}
#history-list::-webkit-scrollbar-thumb{background:var(--lavender);border-radius:2px;}
.hi{
  width:100%;min-height:40px;padding:6px 8px;border-radius:10px;
  background:rgba(255,255,255,.8);border:2px solid var(--lavender);
  display:flex;align-items:center;justify-content:center;
  font-family:'Mochiy Pop One',sans-serif;font-size:15px;color:var(--ink);
  animation:hi-in .35s cubic-bezier(.17,.67,.3,1.5);flex-shrink:0;
  box-shadow:0 3px 8px rgba(180,148,232,.15);
  text-align:center;word-break:break-all;
}
.hi.text-item{
  background:linear-gradient(135deg,rgba(255,180,220,.3),rgba(200,170,240,.3));
  font-size:11px;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;
  line-height:1.3;
}
.hi.latest-item{
  background:linear-gradient(135deg,rgba(255,142,197,.25),rgba(183,148,232,.25));
  border-color:var(--pink);
  box-shadow:0 3px 12px rgba(232,74,156,.25);
}
@keyframes hi-in{from{transform:scale(0) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
#no-history{
  font-size:11px;letter-spacing:.1em;color:var(--ink-soft);opacity:.6;
  text-align:center;line-height:1.8;padding:20px 0;
  font-family:'Zen Maru Gothic',sans-serif;font-weight:700;
}

/* ── FLASH ── */
#flash{
  position:fixed;inset:0;z-index:100;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,200,230,.5) 0%,rgba(200,170,240,.2) 50%,transparent 100%);
  transition:opacity .08s;
}
#flash.show{opacity:1;}

.rainbow-ripple{
  position:fixed;left:50%;top:50%;border-radius:50%;
  border:6px solid;pointer-events:none;z-index:90;
  animation:rainbow-expand 1.2s ease-out forwards;transform:translate(-50%,-50%);
}
@keyframes rainbow-expand{
  0%{width:0;height:0;opacity:1;border-color:var(--pink);}
  33%{border-color:var(--lavender);}
  66%{border-color:var(--mint);}
  100%{width:200vmax;height:200vmax;opacity:0;border-color:var(--gold);}
}

/* ── RESULT SCREEN ── */
#result-screen{
  position:fixed;inset:0;z-index:200;
  opacity:0;pointer-events:none;transition:opacity 0.4s;
  background:linear-gradient(135deg,rgba(253,231,243,.97) 0%,rgba(232,213,255,.97) 50%,rgba(200,230,255,.97) 100%);
  backdrop-filter:blur(20px);
  overflow:hidden;
}
#result-screen.show{opacity:1;pointer-events:all;}

/* 猫：背景に全面表示、薄く透過 */
#result-cat-bg{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
  opacity:.55;
  animation:result-cat-in .7s cubic-bezier(.17,.67,.3,1.4) both;
}
#result-cat-bg svg{
  width:min(80vh,80vw);
  height:min(80vh,80vw);
  filter:blur(0.5px);
}
@keyframes result-cat-in{
  0%{transform:scale(.6);opacity:0;}
  100%{transform:scale(1);opacity:.55;}
}

/* 前景コンテンツ：縦中央 */
#result-content{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:6px;
  padding:20px;
}

/* 数字：超大きく、くっきり読める */
#result-num-big{
  font-family:'Mochiy Pop One',sans-serif;
  font-size:clamp(130px,30vw,360px);
  line-height:1.0;
  padding:0 2vw;
  /* グラデではなく不透明な単色で確実に読める */
  color:#c026a0;
  text-shadow:
    0 0 60px rgba(232,74,156,.5),
    0 0 120px rgba(180,148,232,.35),
    4px 6px 0 rgba(255,255,255,.7),
    -1px -1px 0 rgba(255,255,255,.5);
  animation:big-num-in .65s cubic-bezier(.17,.67,.3,1.4) both;
  text-align:center;
  max-width:96vw;
  word-break:break-all;
  flex-shrink:0;
}
#result-num-big.multi{
  font-size:clamp(52px,11vw,130px);
  line-height:1.2;
  padding:0 6vw;
}
@keyframes big-num-in{
  0%{transform:scale(.1) rotate(-20deg);opacity:0;}
  55%{transform:scale(1.1) rotate(4deg);}
  80%{transform:scale(.97) rotate(-1deg);}
  100%{transform:scale(1) rotate(0);}
}

#result-label{
  font-family:'Zen Maru Gothic',sans-serif;font-weight:900;
  font-size:clamp(13px,2vw,20px);letter-spacing:.35em;
  color:var(--pink-deep);
  animation:fadeup .5s .3s ease both;flex-shrink:0;
}
#result-history-strip{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  max-width:min(90vw,600px);
  animation:fadeup .5s .5s ease both;
  max-height:18vh;overflow-y:auto;flex-shrink:0;
  padding:0 10px;
}
@keyframes fadeup{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.rhi{
  min-width:42px;height:42px;padding:0 10px;border-radius:10px;
  background:rgba(255,255,255,.6);border:2px solid var(--lavender);
  display:flex;align-items:center;justify-content:center;
  font-family:'Mochiy Pop One',sans-serif;font-size:16px;color:var(--ink);
}
.rhi.latest{background:linear-gradient(135deg,var(--pink),var(--lavender));border-color:var(--gold);color:white;font-size:18px;box-shadow:0 4px 16px rgba(232,74,156,.4);}
.rhi.text-item{font-size:13px;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#result-continue-btn{
  margin-top:24px;flex-shrink:0;
  font-family:'Mochiy Pop One',sans-serif;font-size:18px;letter-spacing:.08em;
  padding:13px 40px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--pink),var(--lavender),var(--gold));
  background-size:200% 200%;color:white;
  text-shadow:0 2px 4px rgba(232,74,156,.4);
  box-shadow:0 6px 20px rgba(232,74,156,.4),inset 0 -3px 0 rgba(0,0,0,.1),inset 0 2px 0 rgba(255,255,255,.4);
  transition:all .2s;animation:fadeup .5s .7s ease both,btn-shimmer 3s ease-in-out infinite .7s;
}
#result-continue-btn:hover{transform:translateY(-3px) scale(1.03);}
#result-continue-btn:active{transform:scale(.96);}

@media(max-width:600px){
  :root{--panel-w:160px;}
  #app{margin-left:8px;padding:0 10px 40px;}
  #app.panel-hidden{margin-left:50px;}
  #num-panel{top:70px;left:6px;}
  #panel-toggle{top:70px;left:6px;}
}
</style>
</head>
<body>

<div id="bg-stars"></div>
<div id="flash"></div>

<div id="layout">

  <!-- ── LEFT PANEL ── -->
  <div id="num-panel">
    <div id="panel-header">
      <span id="panel-title">母数を選択</span>
      <button id="panel-close" onclick="togglePanel()" title="閉じる">×</button>
    </div>
    <div id="num-grid"></div>
  </div>
  <button id="panel-toggle" onclick="togglePanel()" title="パネルを開く">☰</button>

  <!-- ── MAIN ── -->
  <div id="app">
    <div id="header">
      <div id="title">✦ MAGICAL CAT DRAW ✦</div>
      <div id="subtitle">きまぐれ猫が運命を導く</div>
    </div>

    <div id="mode-tabs">
      <button class="mode-tab active" data-mode="number" onclick="switchMode('number')">数字</button>
      <button class="mode-tab" data-mode="text" onclick="switchMode('text')">テキスト</button>
    </div>

    <div id="config">
      <div id="number-config">
        <div class="config-row">
          <span class="config-label">直接入力 1〜</span>
          <input type="number" class="num-input" id="total-input" value="35" min="1" max="999">
          <span class="config-label">| 1回に</span>
          <input type="number" class="num-input draw-count-input" id="draw-count" value="1" min="1" max="20">
          <span class="config-label">個 |</span>
          <label class="sound-toggle">
            <input type="checkbox" id="sound-toggle" checked>
            <span class="toggle-track"></span>
            <span>音声</span>
          </label>
        </div>
      </div>
      <div class="config-row" id="text-config" style="display:none;">
        <textarea class="text-area" id="text-input" placeholder="抽選対象を1行ずつ入力（例：たろう&#10;じろう&#10;さぶろう）"></textarea>
      </div>
      <div class="config-row" id="text-config-2" style="display:none;">
        <span class="config-label">1回に</span>
        <input type="number" class="num-input draw-count-input" id="draw-count-text" value="1" min="1" max="20">
        <span class="config-label">個 |</span>
        <label class="sound-toggle">
          <input type="checkbox" id="sound-toggle-2" checked>
          <span class="toggle-track"></span>
          <span>音声</span>
        </label>
      </div>
    </div>

    <div id="scene">
      <div id="cat-wrap">
        <svg id="cat-svg" viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="150" cy="225" rx="80" ry="8" fill="rgba(180,120,200,.25)"/>
          <g class="cat-tail">
            <path d="M 215,180 Q 250,170 265,140 Q 275,115 265,95" stroke="#fff" stroke-width="18" fill="none" stroke-linecap="round"/>
            <path d="M 215,180 Q 250,170 265,140 Q 275,115 265,95" stroke="#ffd0e8" stroke-width="12" fill="none" stroke-linecap="round"/>
            <circle cx="265" cy="95" r="8" fill="#ffb3d1"/>
          </g>
          <ellipse cx="150" cy="190" rx="75" ry="45" fill="#ffffff"/>
          <ellipse cx="150" cy="195" rx="55" ry="32" fill="#fff0f6"/>
          <ellipse cx="115" cy="220" rx="18" ry="12" fill="#ffffff"/>
          <ellipse cx="185" cy="220" rx="18" ry="12" fill="#ffffff"/>
          <ellipse cx="115" cy="222" rx="10" ry="5" fill="#ffb3d1"/>
          <ellipse cx="185" cy="222" rx="10" ry="5" fill="#ffb3d1"/>
          <circle cx="150" cy="135" r="55" fill="#ffffff"/>
          <g class="cat-ear cat-ear-l">
            <path d="M 105,105 L 95,65 L 130,90 Z" fill="#ffffff"/>
            <path d="M 110,98 L 105,78 L 122,90 Z" fill="#ffb3d1"/>
          </g>
          <g class="cat-ear cat-ear-r">
            <path d="M 195,105 L 205,65 L 170,90 Z" fill="#ffffff"/>
            <path d="M 190,98 L 195,78 L 178,90 Z" fill="#ffb3d1"/>
          </g>
          <circle cx="115" cy="145" r="10" fill="#ffc8dc" opacity=".7"/>
          <circle cx="185" cy="145" r="10" fill="#ffc8dc" opacity=".7"/>
          <path id="eye-l-closed" d="M 122,130 Q 130,135 138,130" stroke="#4a3960" stroke-width="3" fill="none" stroke-linecap="round"/>
          <g id="eye-l-open" style="display:none;">
            <ellipse cx="130" cy="132" rx="6" ry="8" fill="#4a3960"/>
            <ellipse cx="131" cy="129" rx="2" ry="3" fill="white"/>
          </g>
          <path id="eye-r-closed" d="M 162,130 Q 170,135 178,130" stroke="#4a3960" stroke-width="3" fill="none" stroke-linecap="round"/>
          <g id="eye-r-open" style="display:none;">
            <ellipse cx="170" cy="132" rx="6" ry="8" fill="#4a3960"/>
            <ellipse cx="171" cy="129" rx="2" ry="3" fill="white"/>
          </g>
          <path d="M 145,145 L 155,145 L 150,150 Z" fill="#ff8eb8"/>
          <path id="mouth-closed" d="M 150,150 Q 145,156 140,154 M 150,150 Q 155,156 160,154" stroke="#4a3960" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path id="mouth-happy" d="M 138,150 Q 150,162 162,150" stroke="#4a3960" stroke-width="2.5" fill="none" stroke-linecap="round" style="display:none;"/>
          <g stroke="#4a3960" stroke-width="1.2" stroke-linecap="round" opacity=".5">
            <line x1="100" y1="148" x2="80" y2="145"/>
            <line x1="100" y1="153" x2="80" y2="155"/>
            <line x1="200" y1="148" x2="220" y2="145"/>
            <line x1="200" y1="153" x2="220" y2="155"/>
          </g>
          <g id="zzz">
            <text x="220" y="80" font-family="Mochiy Pop One" font-size="20" fill="#b794e8" opacity=".7">z</text>
            <text x="235" y="65" font-family="Mochiy Pop One" font-size="15" fill="#b794e8" opacity=".5">z</text>
            <text x="248" y="52" font-family="Mochiy Pop One" font-size="11" fill="#b794e8" opacity=".4">z</text>
          </g>
        </svg>
      </div>
      <div id="crystal-wrap">
        <div id="crystal-ring"></div>
        <div id="crystal">
          <div id="crystal-text" class="ready">READY</div>
        </div>
      </div>
    </div>

    <div id="controls">
      <button id="btn-draw" onclick="startDraw()">くじを引く</button>
      <button id="btn-reset" onclick="resetDraw()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 8a6 6 0 1 1 1.5 4"/><path d="M2 12V8h4"/>
        </svg>
        最初から
      </button>
    </div>

    <div id="counter">残り <strong>—</strong> / <strong>—</strong></div>

  </div><!-- /#app -->

  <!-- ── RIGHT PANEL (history) ── -->
  <div id="history-panel">
    <div id="history-panel-header">
      <span id="history-panel-title">引いた結果</span>
      <span id="history-count">0</span>
    </div>
    <div id="history-list">
      <div id="no-history">まだ<br>引いて<br>ないよ<br>✨</div>
    </div>
  </div>

</div><!-- /#layout -->

<!-- ── RESULT SCREEN ── -->
<div id="result-screen">

  <!-- 猫：背景レイヤー -->
  <div id="result-cat-bg">
    <svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
      <ellipse cx="150" cy="225" rx="80" ry="8" fill="rgba(180,120,200,.15)"/>
      <ellipse cx="150" cy="190" rx="75" ry="45" fill="rgba(255,255,255,.55)"/>
      <ellipse cx="115" cy="220" rx="18" ry="12" fill="rgba(255,255,255,.55)"/>
      <ellipse cx="185" cy="220" rx="18" ry="12" fill="rgba(255,255,255,.55)"/>
      <ellipse cx="85" cy="155" rx="14" ry="22" fill="rgba(255,255,255,.55)" transform="rotate(-30 85 155)"/>
      <ellipse cx="215" cy="155" rx="14" ry="22" fill="rgba(255,255,255,.55)" transform="rotate(30 215 155)"/>
      <circle cx="150" cy="135" r="55" fill="rgba(255,255,255,.55)"/>
      <path d="M 105,105 L 95,65 L 130,90 Z" fill="rgba(255,255,255,.55)"/>
      <path d="M 110,98 L 105,78 L 122,90 Z" fill="rgba(255,179,209,.45)"/>
      <path d="M 195,105 L 205,65 L 170,90 Z" fill="rgba(255,255,255,.55)"/>
      <path d="M 190,98 L 195,78 L 178,90 Z" fill="rgba(255,179,209,.45)"/>
      <circle cx="115" cy="145" r="10" fill="rgba(255,200,220,.45)"/>
      <circle cx="185" cy="145" r="10" fill="rgba(255,200,220,.45)"/>
      <path d="M 120,132 Q 130,124 140,132" stroke="rgba(180,148,232,.5)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 160,132 Q 170,124 180,132" stroke="rgba(180,148,232,.5)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 145,145 L 155,145 L 150,150 Z" fill="rgba(255,142,184,.5)"/>
      <path d="M 138,150 Q 150,162 162,150" stroke="rgba(180,148,232,.5)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- 前景コンテンツ -->
  <div id="result-content">
    <div id="result-num-big"></div>
    <div id="result-label">★ お告げ ★</div>
    <div id="result-history-strip"></div>
    <button id="result-continue-btn" onclick="closeResultScreen()">続けて引く</button>
  </div>

</div>

<script>
// ── BG ──────────────────────────────────────────────────────
function initBg(){
  const bg = document.getElementById('bg-stars');
  [{color:'rgba(255,180,220,.5)',x:10,y:20,size:200},
   {color:'rgba(200,170,240,.5)',x:75,y:60,size:250},
   {color:'rgba(170,220,240,.4)',x:50,y:85,size:180},
   {color:'rgba(255,220,180,.4)',x:85,y:15,size:160}].forEach((b,i)=>{
    const el=document.createElement('div');
    el.className='bg-blob';
    el.style.cssText=`background:${b.color};left:${b.x}%;top:${b.y}%;width:${b.size}px;height:${b.size}px;animation-delay:${i*2}s;`;
    bg.appendChild(el);
  });
  for(let i=0;i<30;i++){
    const s=document.createElement('div');s.className='bg-star';
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${2+Math.random()*3}s;--delay:${Math.random()*3}s;transform:scale(${.5+Math.random()*.8});`;
    bg.appendChild(s);
  }
}

// ── PANEL ───────────────────────────────────────────────────
let panelOpen = true;
function togglePanel(){
  panelOpen = !panelOpen;
  document.getElementById('num-panel').classList.toggle('hidden', !panelOpen);
  document.getElementById('panel-toggle').classList.toggle('visible', !panelOpen);
  document.getElementById('app').classList.toggle('panel-hidden', !panelOpen);
}

// ── STATE ───────────────────────────────────────────────────
let mode='number', total=35, drawCount=1;
let pool=[], allItems=[], history=[];
let isRolling=false, soundEnabled=true;

// ── AUDIO ───────────────────────────────────────────────────
let audioCtx=null;
function getAudio(){
  if(!audioCtx) try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
  return audioCtx;
}
function beep(freq,dur,type='sine',vol=0.15){
  if(!soundEnabled) return;
  const ctx=getAudio();if(!ctx) return;
  const osc=ctx.createOscillator(),g=ctx.createGain();
  osc.type=type;osc.frequency.value=freq;g.gain.value=vol;
  osc.connect(g);g.connect(ctx.destination);
  osc.start();g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);osc.stop(ctx.currentTime+dur);
}
function rollSound(){beep(800+Math.random()*400,0.04,'square',0.06);}
function resultSound(){[523,659,784,1047].forEach((n,i)=>setTimeout(()=>beep(n,0.3,'triangle',0.12),i*80));}
function readySound(){beep(880,0.15,'triangle',0.1);setTimeout(()=>beep(1175,0.2,'triangle',0.1),100);}

// ── INIT ────────────────────────────────────────────────────
function switchMode(newMode){
  if(isRolling) return;
  mode=newMode;
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===newMode));
  if(newMode==='number'){
    document.getElementById('number-config').style.display='';
    document.getElementById('text-config').style.display='none';
    document.getElementById('text-config-2').style.display='none';
    document.getElementById('num-panel').style.display='';
    document.getElementById('panel-toggle').style.display=panelOpen?'none':'flex';
  } else {
    document.getElementById('number-config').style.display='';
    document.getElementById('text-config').style.display='flex';
    document.getElementById('text-config-2').style.display='flex';
    // テキストモードでもパネルは維持（非表示にはしない）
  }
  reset();
}

function syncSoundToggles(){
  document.getElementById('sound-toggle').addEventListener('change',e=>{
    soundEnabled=e.target.checked;
    document.getElementById('sound-toggle-2').checked=e.target.checked;
  });
  document.getElementById('sound-toggle-2').addEventListener('change',e=>{
    soundEnabled=e.target.checked;
    document.getElementById('sound-toggle').checked=e.target.checked;
  });
}

function readConfig(){
  if(mode==='number'){
    const t=parseInt(document.getElementById('total-input').value)||35;
    total=Math.max(1,Math.min(999,t));
    document.getElementById('total-input').value=total;
    allItems=Array.from({length:total},(_,i)=>i+1);
    drawCount=parseInt(document.getElementById('draw-count').value)||1;
  } else {
    const items=document.getElementById('text-input').value
      .split('\n').map(s=>s.trim()).filter(s=>s.length>0);
    allItems=items; total=items.length;
    drawCount=parseInt(document.getElementById('draw-count-text').value)||1;
  }
  drawCount=Math.max(1,Math.min(20,drawCount,total||1));
}

function reset(){
  readConfig();
  pool=[...allItems]; history=[];
  updateUI();
  setCrystalDisplay(total===0?'LIST?':'READY',true);
  document.getElementById('crystal-ring').classList.remove('active');
  setCatAsleep();
}
function resetDraw(){if(!isRolling) reset();}

function attachConfigListeners(){
  document.getElementById('total-input').addEventListener('change',()=>{
    if(isRolling) return;
    const v=Math.max(1,Math.min(999,parseInt(document.getElementById('total-input').value)||35));
    document.getElementById('total-input').value=v;
    total=v;
    document.querySelectorAll('.num-btn').forEach(b=>{
      b.classList.toggle('selected',+b.dataset.n===v);
      b.classList.remove('drawn');
    });
    reset();
  });
  ['draw-count','draw-count-text'].forEach(id=>{
    document.getElementById(id).addEventListener('change',()=>{if(!isRolling) reset();});
  });
  document.getElementById('text-input').addEventListener('blur',()=>{if(!isRolling) reset();});
}

// ── GRID ────────────────────────────────────────────────────
function buildGrid(){
  const grid=document.getElementById('num-grid');
  grid.innerHTML='';
  for(let i=1;i<=35;i++){
    const btn=document.createElement('button');
    btn.className='num-btn'+(i===total?' selected':'');
    btn.textContent=i; btn.dataset.n=i;
    btn.addEventListener('click',()=>selectTotal(i));
    grid.appendChild(btn);
  }
}
function selectTotal(n){
  if(isRolling) return;
  total=n;
  document.getElementById('total-input').value=n;
  document.querySelectorAll('.num-btn').forEach(b=>{
    b.classList.toggle('selected',+b.dataset.n===n);
    b.classList.remove('drawn');
  });
  reset();
}
function updateDrawnGrid(){
  if(mode!=='number') return;
  const drawn=new Set(history.map(Number));
  document.querySelectorAll('.num-btn').forEach(b=>{
    const n=+b.dataset.n;
    if(n<=total) b.classList.toggle('drawn',drawn.has(n));
  });
}

// ── CAT ─────────────────────────────────────────────────────
function setCatAsleep(){
  document.getElementById('cat-svg').classList.remove('awake','celebrate');
  document.getElementById('eye-l-closed').style.display='';
  document.getElementById('eye-r-closed').style.display='';
  document.getElementById('eye-l-open').style.display='none';
  document.getElementById('eye-r-open').style.display='none';
  document.getElementById('mouth-closed').style.display='';
  document.getElementById('mouth-happy').style.display='none';
  document.getElementById('zzz').style.display='';
  document.querySelector('.cat-tail').classList.remove('excited');
}
function setCatAwake(){
  document.getElementById('cat-svg').classList.add('awake');
  document.getElementById('eye-l-closed').style.display='none';
  document.getElementById('eye-r-closed').style.display='none';
  document.getElementById('eye-l-open').style.display='';
  document.getElementById('eye-r-open').style.display='';
  document.getElementById('zzz').style.display='none';
  document.querySelector('.cat-tail').classList.add('excited');
}
function setCatHappy(){
  const svg=document.getElementById('cat-svg');
  svg.classList.add('celebrate');
  document.getElementById('mouth-closed').style.display='none';
  document.getElementById('mouth-happy').style.display='';
  setTimeout(()=>svg.classList.remove('celebrate'),400);
}

// ── DRAW ────────────────────────────────────────────────────
async function startDraw(){
  if(isRolling||pool.length===0) return;
  readConfig();
  if(pool.length===0) return;
  const actualDraws=Math.min(drawCount,pool.length);
  isRolling=true;
  document.getElementById('btn-draw').disabled=true;
  document.getElementById('crystal-ring').classList.add('active');
  setCatAwake(); readySound();
  await rollAnimation();
  const results=[];
  for(let i=0;i<actualDraws;i++){
    const idx=Math.floor(Math.random()*pool.length);
    results.push(pool.splice(idx,1)[0]);
  }
  history.push(...results);
  await showResult(results);
  updateUI();
  document.getElementById('crystal-ring').classList.remove('active');
  isRolling=false;
  document.getElementById('btn-draw').disabled=pool.length===0;
}

function rollAnimation(){
  return new Promise(resolve=>{
    const el=document.getElementById('crystal-text');
    const crystal=document.getElementById('crystal');
    el.classList.remove('ready','result');
    el.classList.add('rolling-text');
    crystal.classList.add('rolling');
    let frame=0; const totalFrames=38;
    const tick=()=>{
      if(frame>=totalFrames){crystal.classList.remove('rolling');resolve();return;}
      const t=frame/totalFrames;
      const interval=t<0.5?32:32+(t-0.5)*180;
      const r=allItems[Math.floor(Math.random()*allItems.length)];
      const d=String(r);
      el.textContent=d.length>8?d.slice(0,7)+'…':d;
      el.style.fontSize=d.length>5?'clamp(20px,4vw,30px)':'';
      frame++;
      setTimeout(tick,interval);
      if(frame%4===0){flashScreen();rollSound();}
    };
    tick();
  });
}

function showResult(results){
  return new Promise(resolve=>{
    const el=document.getElementById('crystal-text');
    el.classList.remove('rolling-text','ready');
    const first=String(results[0]);
    el.textContent=first.length>8?first.slice(0,7)+'…':first;
    el.style.fontSize=first.length>5?'clamp(20px,4vw,30px)':'';
    el.classList.add('result');
    flashScreen(); resultSound(); setCatHappy();
    spawnRainbowRipple(); spawnParticles(); shatterCrystal();
    setTimeout(()=>{openResultScreen(results);resolve();},600);
  });
}

function openResultScreen(results){
  const big=document.getElementById('result-num-big');
  if(results.length===1){big.textContent=results[0];big.classList.remove('multi');}
  else{big.textContent=results.join('  ·  ');big.classList.add('multi');}
  big.classList.remove('big-num-in');void big.offsetWidth;

  const strip=document.getElementById('result-history-strip');
  strip.innerHTML='';
  const recentSet=new Set(results.map(String));
  [...history].reverse().forEach((item,i)=>{
    const d=document.createElement('div');
    const isLatest=i<results.length&&recentSet.has(String(item));
    d.className='rhi'+(isLatest?' latest':'')+(mode==='text'?' text-item':'');
    d.textContent=item;strip.appendChild(d);
  });

  document.getElementById('result-continue-btn').textContent=pool.length===0?'最初から':'続けて引く';
  document.getElementById('app').style.opacity='0';
  document.getElementById('result-screen').classList.add('show');
  setTimeout(spawnFireworks,200);
  setTimeout(spawnFireworks,600);
}

function closeResultScreen(){
  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('app').style.opacity='1';
  const ct=document.getElementById('crystal-text');ct.className='';
  isRolling=false;
  document.getElementById('btn-draw').disabled=pool.length===0;
  document.getElementById('crystal-ring').classList.remove('active');
  setCatAsleep();
  if(pool.length===0) resetDraw();
}

// ── EFFECTS ─────────────────────────────────────────────────
function flashScreen(){
  const f=document.getElementById('flash');f.classList.add('show');
  setTimeout(()=>f.classList.remove('show'),100);
}
function spawnRainbowRipple(){
  const r=document.createElement('div');r.className='rainbow-ripple';
  document.body.appendChild(r);setTimeout(()=>r.remove(),1300);
}
function spawnParticles(){
  const wrap=document.getElementById('crystal-wrap');
  const types=['heart','star','sparkle'];
  for(let i=0;i<30;i++){
    const p=document.createElement('div');
    p.className='particle '+types[Math.floor(Math.random()*types.length)];
    const angle=Math.random()*Math.PI*2,dist=90+Math.random()*120;
    p.style.cssText=`left:50%;top:50%;--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;--dur:${0.7+Math.random()*0.6}s;--rot:${(Math.random()-.5)*720}deg;margin:-7px;`;
    wrap.appendChild(p);setTimeout(()=>p.remove(),1500);
  }
}
function shatterCrystal(){
  const wrap=document.getElementById('crystal-wrap');
  for(let i=0;i<12;i++){
    const s=document.createElement('div');s.className='shard';
    const angle=(i/12)*Math.PI*2,dist=60+Math.random()*60;
    s.style.cssText=`left:50%;top:50%;--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;--rot:${(Math.random()-.5)*720}deg;margin:-10px;`;
    wrap.appendChild(s);setTimeout(()=>s.remove(),700);
  }
}
function spawnFireworks(){
  const screen=document.getElementById('result-screen');
  if(!screen.classList.contains('show')) return;
  const cx=20+Math.random()*60,cy=20+Math.random()*50;
  const launcher=document.createElement('div');
  launcher.style.cssText=`position:fixed;left:${cx}%;top:${cy}%;pointer-events:none;z-index:201;`;
  screen.appendChild(launcher);
  const types=['heart','star','sparkle'];
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    p.className='particle '+types[Math.floor(Math.random()*types.length)];
    const angle=Math.random()*Math.PI*2,dist=80+Math.random()*100;
    p.style.cssText=`position:absolute;left:0;top:0;--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;--dur:${0.8+Math.random()*0.6}s;--rot:${(Math.random()-.5)*720}deg;`;
    launcher.appendChild(p);
  }
  setTimeout(()=>launcher.remove(),1700);
}

// ── UI ──────────────────────────────────────────────────────
function setCrystalDisplay(text,isLabel){
  const el=document.getElementById('crystal-text');
  el.className=isLabel?'ready':'';el.textContent=text;el.style.fontSize='';
}
function updateUI(){
  document.getElementById('counter').innerHTML=`残り <strong>${pool.length}</strong> / <strong>${total}</strong>`;
  document.getElementById('history-count').textContent=history.length;
  document.getElementById('btn-draw').disabled=pool.length===0||isRolling;
  const list=document.getElementById('history-list');
  const noH=document.getElementById('no-history');
  if(history.length===0){
    list.innerHTML='';list.appendChild(noH);
  } else {
    if(noH.parentNode) noH.remove();
    list.innerHTML='';
    [...history].reverse().forEach((item, i)=>{
      const hi=document.createElement('div');
      hi.className='hi'+(mode==='text'?' text-item':'')+(i===0?' latest-item':'');
      hi.textContent=item;list.appendChild(hi);
    });
  }
  updateDrawnGrid();
}

// ── START ───────────────────────────────────────────────────
initBg();
syncSoundToggles();
attachConfigListeners();
buildGrid();
reset();
</script>
